#
# Builds and publishes this fork's CE (enterprise-stripped) docker image to GHCR
# on every push to master or develop, so production/staging can just `docker compose pull`.
#
# master  -> ghcr.io/<repo>:latest   (production)
# develop -> ghcr.io/<repo>:develop  (staging / soak-testing upcoming changes)
#

name: Build and Publish Fork Docker Image

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set floating tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "FLOATING_TAG=latest" >> $GITHUB_ENV
          else
            echo "FLOATING_TAG=develop" >> $GITHUB_ENV
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FLOATING_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
